:root{
  color-scheme:light;
  --ink:#103b75;        /* 警察蓝：标题、主色块 */
  --blue:#1457a6;       /* 交互蓝 */
  --score:#0969c9;      /* 科技蓝：分数 */
  --bg:#f2f6fc;         /* 打分/排名底色 */
  --line:#d3dfee;
  --muted:#4d6584;
  --amber:#b8760f;      /* 极值 */
  --navy:#0c2b57;       /* 颁奖底色 */
  --navy-2:#133a6d;
  --gold:#e2bd62; --silver:#c8d5e6; --bronze:#d9a173;
  --num:'Score Sans','Noto Sans SC',sans-serif;
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box}
body{margin:0;background:#e7edf5;color:#232e3b}
.doc{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
.doc h1{font-size:22px;color:var(--ink);margin:0 0 6px}
.doc > p{margin:0 0 18px;color:#4d5b6b;font-size:14px;line-height:1.8}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid #c3d1e3;background:#fff;border-radius:6px;color:#23446f;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button:focus-visible{outline:3px solid #99aac0;outline-offset:2px}
.note{font-size:13px;color:#4d5b6b;margin:10px 0 0;line-height:1.8}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px #c3d1e3}
.frame > .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

/* ---------- 统一舞台框架：页首 / 主体 / 页脚 ---------- */
.stage{display:grid;grid-template-rows:auto 1fr auto;padding:0 96px 40px;background:var(--bg);border-top:6px solid var(--ink);color:var(--ink)}
.stage > header{display:flex;align-items:center;justify-content:space-between;height:96px;border-bottom:1px solid var(--line)}
.event{font-size:26px;font-weight:650;letter-spacing:.02em}
.context{display:flex;gap:28px;font-size:22px;color:var(--muted)}
.context b{font-family:var(--num);font-weight:600;color:var(--ink)}
.stage > footer{height:40px;display:flex;align-items:end;justify-content:center;font-family:var(--num);font-size:20px;color:var(--muted)}
.stage main{min-height:0}

/* ---------- 打分画面 ---------- */
.score-main{display:grid;grid-template-rows:auto auto 1fr;}
.score-main.revealed{grid-template-rows:auto 1fr;}
.score-main{gap:36px;padding-top:44px}
.top{display:grid;grid-template-columns:1fr minmax(480px,auto);gap:48px;align-items:stretch}
.team{display:flex;flex-direction:column;justify-content:center;gap:22px}
.phase{align-self:start;font-size:22px;padding:8px 18px;border-radius:6px;background:#dfe9f8;color:#214e83}
.phase.done{background:var(--ink);color:#fff}
.team h2{margin:0;font-size:84px;line-height:1.15;font-weight:650}
.team h2 span{font-family:var(--num);font-weight:500;color:#3b79b9;font-size:.72em;margin-right:.35em}
.result{background:var(--ink);border-radius:12px;color:#fff;padding:28px 36px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;min-height:250px}
.result span{font-size:24px;color:#cfe0f7}
.result strong{font-family:var(--num);font-weight:600;font-size:150px;line-height:1;display:flex;align-items:baseline;justify-content:flex-end;white-space:nowrap}
.result strong small{font-size:30px;margin-left:12px;color:#c8def7;font-weight:400}
.result.wait strong{font-size:120px}
.result.wait strong small{font-size:44px}
.result .dash{opacity:.45}
.progress{display:grid;grid-auto-flow:column;gap:8px;height:10px}
.progress i{border-radius:5px;background:#d4e0ef}
.progress i.on{background:var(--blue)}
.judges{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;gap:18px;min-height:0}
.judge{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:background-color .35s,border-color .35s,opacity .5s,transform .5s}
.judge .who{font-size:28px;color:var(--muted)}
.judge .who b{font-family:var(--num);font-weight:600;color:var(--ink);margin-left:4px}
.judge .val{font-family:var(--num);font-weight:600;font-size:96px;line-height:1;color:var(--ink)}
.judge .state{font-size:40px;display:flex;align-items:center;gap:10px;color:#5f6873}
.judge.sub{background:#e3eefd;border-color:#a5c5ee}
.judge.sub .state{color:var(--blue)}
.judge .tag{position:absolute;top:18px;right:18px;font-size:20px;padding:3px 10px;border-radius:5px;background:var(--amber);color:#fff;opacity:0;transition:opacity .3s}
.judge.ext{background:#fff3d6;border:2px solid var(--amber)}
.judge.ext .tag{opacity:1}
.judge.cut{background:#e7ecf3;border-color:#b2c0d2;transform:scale(.95)}
.judge.cut .val{color:#6a7d96;text-decoration:line-through 3px}
.judge.cut .tag{background:#7b8ca3}
.judges.many{gap:10px}
.judges.many .judge{padding:10px 14px;border-radius:8px}
.judges.many .who{font-size:18px}
.judges.many .val{font-size:44px}
.judges.many .tag{font-size:14px;top:8px;right:8px;padding:1px 6px}
.flip{animation:flip .45s ease-out both}
@keyframes flip{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.arrive{animation:arrive .6s ease-out both}
@keyframes arrive{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* ---------- 排名 ---------- */
.rank-main{display:grid;grid-template-rows:auto 1fr;gap:28px;padding-top:36px}
.rank-head{display:flex;align-items:baseline;justify-content:space-between}
.rank-head h1{margin:0;font-size:56px;font-weight:650}
.rank-head span{font-size:22px;color:var(--muted)}
.board{display:grid;grid-auto-rows:1fr;gap:10px;min-height:0}
.row{display:grid;grid-template-columns:150px 1fr 200px 260px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 40px 0 0;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:transparent}
.row .no{font-family:var(--num);font-weight:600;font-size:56px;text-align:center;color:#7a8ea8}
.row .name{font-size:38px;font-weight:600}
.row .prize{justify-self:start;font-size:22px;padding:4px 14px;border-radius:6px;border:1px solid currentColor}
.row .pts{font-family:var(--num);font-weight:600;font-size:60px;text-align:right;color:var(--score)}
.row.r1{background:#f3f7ff;border-color:#b9cff0}
.row.r1::before{background:#d9a72e}.row.r1 .no{color:#a87508}.row.r1 .pts{font-size:64px}
.row.r2::before{background:#9fb3cc}.row.r2 .no{color:#58718f}
.row.r3::before{background:#c98a5a}.row.r3 .no{color:#9a5d33}
.prize.p1{color:#8a6206;background:#fbf0d2}.prize.p2{color:#4c6684;background:#edf2f8}.prize.p3{color:#8a5432;background:#f8ebe1}
.board.enter .row{animation:flip .5s ease-out both}

/* ---------- 颁奖（深蓝） ---------- */
.stage.ceremony{background:var(--navy);border-top-color:var(--gold);color:#fff}
.ceremony > header{border-bottom-color:rgba(255,255,255,.14)}
.ceremony .event{color:#fff}
.ceremony .context{color:#a9c1e2}
.ceremony > footer{color:#8fa9cc}
.award-main{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:56px;padding-top:20px}
.level{display:flex;align-items:center;gap:36px;color:var(--medal)}
.level::before,.level::after{content:"";width:180px;height:2px;background:currentColor;opacity:.55}
.stage .level h1{color:inherit;margin:0;font-size:104px;font-weight:700;letter-spacing:.12em;line-height:1}
.level small{display:block;text-align:center;font-size:24px;letter-spacing:.3em;color:#a9c1e2;margin-bottom:18px;font-weight:400}
.winners{display:grid;grid-template-columns:repeat(var(--n),minmax(0,560px));gap:32px;justify-content:center;width:100%}
.winner{background:var(--navy-2);border:1px solid color-mix(in srgb,var(--medal) 45%,transparent);border-top:4px solid var(--medal);border-radius:12px;padding:44px 40px;text-align:center}
.winner h2{margin:0;font-size:56px;font-weight:650}
.winner p{margin:24px 0 0;font-size:34px;line-height:1.7;color:#cfe0f7}
.people{display:grid;grid-template-columns:repeat(var(--n),minmax(0,520px));gap:32px;justify-content:center;width:100%}
.person{background:var(--navy-2);border:1px solid rgba(226,189,98,.35);border-radius:12px;padding:56px 36px;text-align:center}
.person span{font-size:30px;color:var(--gold);letter-spacing:.08em}
.person h2{margin:28px 0 0;font-size:96px;font-weight:650;letter-spacing:.06em}
.person p{margin:20px 0 0;font-size:24px;color:#a9c1e2}
.ceremony.enter .level{animation:arrive .7s ease-out both}
.ceremony.enter .winner,.ceremony.enter .person{animation:flip .6s ease-out both}

/* ---------- 手机端 ---------- */
.phones{display:flex;gap:28px;flex-wrap:wrap;padding:10px 10px 24px}
.phone{width:390px;height:780px;border-radius:28px;box-shadow:0 0 0 10px #1f2b3a;overflow:hidden;background:#f2f6fc;display:flex;flex-direction:column}
.p-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink);font-weight:600}
.p-top span{font-size:12px;color:#3d7a4f;font-weight:400}
.p-body{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.p-meta{font-size:13px;color:var(--muted)}
.p-team{font-size:30px;font-weight:650;color:var(--ink);margin:0}
.p-team span{font-family:var(--num);color:#3b79b9;margin-right:10px;font-weight:500}
.p-field label{font-size:14px;color:var(--muted);display:block;margin-bottom:8px}
.p-input{height:96px;border:2px solid var(--blue);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:56px;font-weight:600;color:var(--ink)}
.p-hint{font-size:13px;color:var(--muted);margin-top:8px}
.p-btn{margin-top:auto;height:56px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.p-done{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 20px;text-align:center}
.p-done b{display:block;font-size:16px;color:#2e7a47;margin-bottom:10px}
.p-done strong{font-family:var(--num);font-size:72px;color:var(--ink)}
.p-done small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
.p-next{font-size:14px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="doc">
  <h1>竞衡 · 前端展示优化草图</h1>
  <p>静态示意，用于确认方向，不是最终代码。画面按 1920×1080 投屏绘制后等比缩放；“播放亮分”按现有 1.5 / 3.1 / 4.3 秒节奏演示四个阶段。</p>
  <div class="tabs" role="group" aria-label="切换画面">
    <button data-v="scoring" aria-pressed="true">打分中</button>
    <button data-v="reveal">亮分（播放）</button>
    <button data-v="many">30 位评委</button>
    <button data-v="ranking">得分排名</button>
    <button data-v="team3">团体奖 · 三等奖</button>
    <button data-v="team1">团体奖 · 一等奖</button>
    <button data-v="people">个人奖项</button>
    <button data-v="phone">评委手机端</button>
  </div>
  <div id="view"></div>
  <p class="note" id="note"></p>
</div>
<script>
const judges=[88,95.25,83.5,90,78.25,85.5,92];
const fmt=v=>v.toFixed(2);
const head=(ctx)=>`<header><span class="event">2026 年度警务技能比武</span><span class="context">${ctx}</span></header>`;
function cols(n){return n<=5?n:n<=12?Math.ceil(n/2):Math.min(10,Math.ceil(n/3))}
function scoring(sub){
  const n=judges.length;
  return `<div class="stage">${head('<span>正式比赛</span><span>第 <b>3</b> / 6 队</span>')}
  <main class="score-main">
    <div class="top"><div class="team"><span class="phase">评委评分中</span><h2><span>03</span>第三代表队</h2></div>
      <div class="result wait"><span>已提交</span><strong>${sub}<small>/ ${n}</small></strong></div></div>
    <div class="progress">${judges.map((_,i)=>`<i class="${i<sub?'on':''}"></i>`).join('')}</div>
    <div class="judges" style="--cols:${cols(n)}">${judges.map((_,i)=>`<div class="judge ${i<sub?'sub':''}"><span class="who">评委<b>${String(i+1).padStart(2,'0')}</b></span><span class="state">${i<sub?'✓ 已打分':'◷ 未打分'}</span></div>`).join('')}</div>
  </main><footer></footer></div>`;
}
function reveal(step,list=judges,many=false){
  const hi=list.indexOf(Math.max(...list)),lo=list.indexOf(Math.min(...list));
  const kept=list.filter((_,i)=>i!==hi&&i!==lo),avg=kept.reduce((a,b)=>a+b,0)/kept.length;
  const phase=['全部亮分','标记最高 / 最低分','剔除极值','评分结果'][step];
  return `<div class="stage">${head('<span>正式比赛</span><span>第 <b>3</b> / 6 队</span>')}
  <main class="score-main revealed" style="${many?'gap:24px;padding-top:28px':''}">
    <div class="top"><div class="team"><span class="phase ${step===3?'done':''}">${phase}</span><h2><span>03</span>第三代表队</h2></div>
      <div class="result"><span>${step===3?'最终得分':'&nbsp;'}</span>${step===3?`<strong class="arrive">${fmt(avg)}<small>分</small></strong>`:'<strong class="dash">—</strong>'}</div></div>
    <div class="judges ${many?'many':''}" style="--cols:${cols(list.length)}">${list.map((v,i)=>{const x=i===hi||i===lo;return `<div class="judge sub ${step===0?'flip':''} ${x&&step>=1?'ext':''} ${x&&step>=2?'cut':''}" style="animation-delay:${i*40}ms"><span class="who">评委<b>${String(i+1).padStart(2,'0')}</b></span><span class="val">${fmt(v)}</span><span class="tag">${step>=2?'已剔除':i===hi?'最高分':'最低分'}</span></div>`}).join('')}</div>
  </main><footer></footer></div>`;
}
const teams=[["第三代表队",87.8,1],["第四代表队",87.3,2],["第五代表队",86.4,2],["第六代表队",86.15,3],["第一代表队",85.4,3],["第二代表队",85.15,0],["第七代表队",84.9,0],["第八代表队",84.15,0]];
function ranking(){
  return `<div class="stage">${head('<span>最终成绩</span>')}
  <main class="rank-main"><div class="rank-head"><h1>得分排名</h1><span>共 8 支队伍</span></div>
  <div class="board enter">${teams.map(([t,s,p],i)=>`<div class="row r${i+1}" style="animation-delay:${(teams.length-i)*70}ms"><span class="no">${i+1}</span><span class="name">${t}</span><span>${p?`<span class="prize p${p}">${'一二三'[p-1]}等奖</span>`:''}</span><span class="pts">${fmt(s)}</span></div>`).join('')}</div></main>
  <footer>1 / 1</footer></div>`;
}
function team(level){
  const data=level===3?[["第六代表队","钱程、冯越、褚卫东"],["第一代表队","陈志远、王晓峰、刘文静"]]:[["第三代表队","周建华、吴迪、郑海"]];
  const medal=level===1?'var(--gold)':level===2?'var(--silver)':'var(--bronze)';
  return `<div class="stage ceremony enter" style="--medal:${medal}">${head('<span>团体奖项</span>')}
  <main class="award-main"><div><div class="level" style="--medal:${medal}"><h1>${'一二三'[level-1]}等奖</h1></div></div>
  <div class="winners" style="--n:${data.length}">${data.map(([t,m],i)=>`<div class="winner" style="animation-delay:${500+i*180}ms"><h2>${t}</h2><p>${m}</p></div>`).join('')}</div></main>
  <footer>${level===3?'1':'3'} / 3</footer></div>`;
}
function people(){
  const d=[["最佳指挥员","陈志远"],["优秀个人","李明"],["最佳射手","钱程"]];
  return `<div class="stage ceremony enter">${head('<span>个人奖项</span>')}
  <main class="award-main"><div class="people" style="--n:3">${d.map(([a,n],i)=>`<div class="person" style="animation-delay:${i*180}ms"><span>${a}</span><h2>${n}</h2></div>`).join('')}</div></main><footer></footer></div>`;
}
function phone(){
  return `<div class="phones">
  <div class="phone"><div class="p-top">评委 01<span>● 已连接</span></div><div class="p-body">
    <div class="p-meta">正式比赛 · 评分中</div><h2 class="p-team"><span>03</span>第三代表队</h2>
    <div class="p-field"><label>总分</label><div class="p-input">88.50</div><div class="p-hint">0–100 分，最多两位小数</div></div>
    <div class="p-btn">提交评分</div></div></div>
  <div class="phone"><div class="p-top">评委 01<span>● 已连接</span></div><div class="p-body">
    <div class="p-meta">正式比赛</div><h2 class="p-team"><span>03</span>第三代表队</h2>
    <div class="p-done"><b>✓ 评分已提交</b><strong>88.50</strong><small>14:32:08 提交 · 已锁定，如需修改请联系管理员</small></div>
    <div class="p-next">下一队：第四代表队</div></div></div>
  <div class="phone"><div class="p-top">评委 01<span>● 已连接</span></div><div class="p-body">
    <div class="p-meta">正式比赛</div><h2 class="p-team"><span>04</span>第四代表队</h2>
    <div class="p-field"><label>总分</label><div class="p-input" style="border-color:#c0392b;color:#c0392b">105</div><div class="p-hint" style="color:#b03a2e">请输入 0–100 之间的分数</div></div>
    <div class="p-btn" style="opacity:.45">提交评分</div></div></div></div>`;
}
const notes={
  scoring:'评委卡片成为主体并占满剩余高度；页首右侧统一放比赛阶段与队伍进度；分段进度条一格对应一位评委。评分中不显示任何分值。',
  reveal:'亮分四阶段沿用现有时序。评委分数逐张翻出（每张间隔 40ms），最高 / 最低分角标标记后划线剔除，最终得分在右侧色块放大出现。',
  many:'评委超过 16 位时自动切换为紧凑网格（每行最多 10 张），1920×1080 与 1366×768 都无需滚动。',
  ranking:'名次用大号数字，前三名左侧加金银铜色条；每行附所获奖级；行高随队伍数自动撑满画面。入场从末位向首位依次出现。',
  team3:'颁奖页改为深蓝底。团体奖按奖级逐页揭晓：三等奖 → 二等奖 → 一等奖；奖级名称先出现，获奖队伍随后依次出现。',
  team1:'一等奖压轴，金色奖级标题；只有一支队伍时卡片居中放大。',
  people:'个人奖项：奖项名称金色，获奖人姓名为最大字号；超过 3 人自动分两行，超过 6 人分页。',
  phone:'评委端：大号数字输入、就地范围校验、提交按钮固定在拇指区；提交后显示提交时间与锁定说明，并提示下一队。不增加二次确认。'
};
const view=document.getElementById('view'),note=document.getElementById('note');
let timers=[];addEventListener('hashchange',()=>show(location.hash.slice(1)));
function fit(){const f=view.querySelector('.frame');if(!f)return;f.firstElementChild.style.transform=`scale(${f.clientWidth/1920})`}
function show(v){
  timers.forEach(clearTimeout);timers=[];
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  note.textContent=notes[v];
  const frame=h=>{view.innerHTML=`<div class="frame">${h}</div>`;fit()};
  if(v==='scoring')frame(scoring(4));
  if(v==='reveal'){frame(reveal(0));[[1500,1],[3100,2],[4300,3]].forEach(([t,s])=>timers.push(setTimeout(()=>frame(reveal(s)),t)));}
  if(v==='many'){const l=Array.from({length:30},(_,i)=>78+((i*7+11)%19)+(i%3)*.25);frame(reveal(3,l,true));}
  if(v==='ranking')frame(ranking());
  if(v==='team3')frame(team(3));
  if(v==='team1')frame(team(1));
  if(v==='people')frame(people());
  if(v==='phone')view.innerHTML=phone();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
addEventListener('resize',fit);
show(location.hash.slice(1)||'scoring');
</script>
</body>
</html>
